[workspace]
resolver = "2"
members = ["crates/podcast-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

# tract is very slow without optimisations; keep tests usable.
[profile.dev.package."*"]
opt-level = 2
[profile.test.package."*"]
opt-level = 2
