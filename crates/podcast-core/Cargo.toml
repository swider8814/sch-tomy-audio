[package]
name = "podcast-core"
version.workspace = true
edition.workspace = true
description = "Audio processing core of SCh Tomy Audio, the sermon podcast tool"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
id3 = "1"
rustfft = "6"
tract-onnx = "0.23"
deunicode = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"
base64 = "0.21"
num-bigint = "0.4"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }

[dev-dependencies]
tempfile = "3"
