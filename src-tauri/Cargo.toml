[package]
name = "schtomy-podcast"
version.workspace = true
edition.workspace = true
description = "SCh Tomy: przygotowanie kazań do podcastu"
default-run = "schtomy-podcast"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
podcast-core = { path = "../crates/podcast-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
