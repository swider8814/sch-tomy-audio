name: CI

# GitHub Actions minutes are limited on a private repository and macOS
# minutes count 10x, Windows 2x. So:
# * pull requests: lint + all tests on Linux, core tests on Windows (cheap);
# * tags v* and manual runs ("Run workflow"): everything, including macOS
#   tests, the three installers and (for tags) the GitHub Release.
# Pushes to branches do not run CI (the pull request run covers them), and
# changes to documentation only do not run it at all.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege by default; only the release job may write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: Lint and app unit tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev ffmpeg
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal -c clippy,rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      - name: Sidecars from the system (Linux is a development platform only)
        run: node scripts/fetch-ffmpeg.mjs --from-path
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p schtomy-podcast --locked
      - name: Core tests with the system ffmpeg
        run: cargo test -p podcast-core --locked
      - run: npm run test:ui

  test:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        # macOS (10x minutes) only for releases and manual runs.
        include: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && '[{"name":"Windows x64","os":"windows-2025","target":"x86_64-pc-windows-msvc","exe":".exe"},{"name":"macOS arm64","os":"macos-15","target":"aarch64-apple-darwin","exe":""}]' || '[{"name":"Windows x64","os":"windows-2025","target":"x86_64-pc-windows-msvc","exe":".exe"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test-${{ matrix.target }}
      - name: Pinned ffmpeg/ffprobe (checksums verified)
        run: node scripts/fetch-ffmpeg.mjs --target ${{ matrix.target }}
      - name: ffmpeg version
        run: src-tauri/binaries/ffmpeg-${{ matrix.target }}${{ matrix.exe }} -hide_banner -version
        shell: bash
      - name: Core tests (generated audio, Polish paths)
        run: cargo test -p podcast-core --locked
        env:
          SCHTOMY_FFMPEG: ${{ github.workspace }}/src-tauri/binaries/ffmpeg-${{ matrix.target }}${{ matrix.exe }}
          SCHTOMY_FFPROBE: ${{ github.workspace }}/src-tauri/binaries/ffprobe-${{ matrix.target }}${{ matrix.exe }}
      - name: UI helper tests
        run: node --test "ui-tests/*.test.mjs"

  build:
    name: Build (${{ matrix.name }})
    # Installers only for releases and manual runs.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x64
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: macos-apple-silicon
          - name: macOS Intel
            os: macos-15
            target: x86_64-apple-darwin
            bundles: dmg
            artifact: macos-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: build-${{ matrix.target }}
      - run: npm ci
      - name: Pinned ffmpeg/ffprobe (checksums verified)
        run: node scripts/fetch-ffmpeg.mjs --target ${{ matrix.target }}
      - name: Build installer
        run: npx tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect installer
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p dist
          bundle="target/${{ matrix.target }}/release/bundle"
          if [ "${{ matrix.bundles }}" = "nsis" ]; then
            cp "$bundle"/nsis/*.exe "dist/SChTomyPodcast-${version}-${{ matrix.artifact }}-setup.exe"
          else
            cp "$bundle"/dmg/*.dmg "dist/SChTomyPodcast-${version}-${{ matrix.artifact }}.dmg"
          fi
          ls -la dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SChTomyPodcast-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release (or add files to one created by hand)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "SCh Tomy Podcast $TAG" \
              --notes "Instalatory dla Windows i macOS. Instrukcja instalacji (także jak otworzyć niepodpisaną aplikację): INSTRUKCJA.md w repozytorium."
          fi
